name: build-and-deploy-dev

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Environment wiring comes from repo variables (Settings -> Secrets and
# variables -> Actions -> Variables), so new environments configure instead of
# editing this file: AWS_REGION, ECR_REGISTRY, ECR_REPO, CI_ROLE_ARN.
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPO: ${{ vars.ECR_REPO }}

jobs:
  build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume ECR push role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      # Deployment is Kargo's job from here: it watches ECR and promotes
      # through dev -> staging via the gitops repo.
